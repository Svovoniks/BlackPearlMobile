<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="48" height="48" viewBox="14.73 14.73 78.55 78.55">
  <!-- The icon for Android 7 (before adaptive icons): the adaptive layers in a 44 dp circle of a 48 dp icon. -->
