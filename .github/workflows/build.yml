name: build

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  check:
    name: analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  release:
    name: signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Check the tag matches pubspec.yaml
        run: |
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi
      - name: Write the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::The signing secrets are missing"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - name: Build the APKs
        # Crash reports go to Sentry only from builds given its DSN (see lib/diagnostics/crash_reports.dart).
        # SENTRY_AUTH_TOKEN lets Sentry's Gradle plugin upload the R8 mapping (see android/app/build.gradle.kts).
        # One APK per ABI, each with only its own native libraries: 64-bit ARM, which nearly every phone runs, and
        # 32-bit ARM. x86_64 runs only on emulators and some Chromebooks, so it isn't built.
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then echo "::warning::SENTRY_AUTH_TOKEN is missing, so the R8 mapping won't be uploaded to Sentry"; fi
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --dart-define=SENTRY_DSN="$SENTRY_DSN"
        env:
          BLACKPEARL_REQUIRE_SIGNING: '1'
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Verify the signatures
        env:
          # SHA-256 of the release signing certificate (public; from keytool -list -v on the release keystore).
          EXPECTED_CERT_SHA256: f236976f66fa697854f3f08271b5fd63ab0383af6958e087daf11e9b0514ba4b
        run: |
          set -euo pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for abi in arm64-v8a armeabi-v7a; do
            # apksigner's own exit code fails the step when the signature doesn't verify.
            # Depending on its version and the schemes used, apksigner prints "Signer #1 certificate ..." or "V2 Signer: certificate ...".
            certs=$("$apksigner" verify --verbose --print-certs "build/app/outputs/flutter-apk/app-$abi-release.apk")
            printf '%s\n' "$certs" | grep -v -i password
            signers=$(printf '%s\n' "$certs" | sed -n -E 's/^(Signer #[0-9]+|V[0-9.]+ Signer:) certificate SHA-256 digest: *//p' | tr -d ' :' | tr 'A-F' 'a-f' | sort -u)
            if [ "$signers" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::The $abi APK is signed with ${signers:-no certificate}, not the release certificate $EXPECTED_CERT_SHA256"
              exit 1
            fi
          done
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The 64-bit ARM APK keeps the plain name, which installed releases up to 0.10.0 look for when they update. Later
        # ones pick the APK for the phone's ABI (lib/update/app_update.dart).
        run: |
          apks=("BlackPearl-${GITHUB_REF_NAME}.apk" "BlackPearl-${GITHUB_REF_NAME}-armeabi-v7a.apk")
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "${apks[0]}"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "${apks[1]}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${apks[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${apks[@]}" --title "BlackPearl Mobile ${GITHUB_REF_NAME#v}" --generate-notes
          fi
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
