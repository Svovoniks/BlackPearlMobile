name: build

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  check:
    name: analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  release:
    name: signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Check the tag matches pubspec.yaml
        run: |
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi
      - name: Write the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::The signing secrets are missing"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - name: Build the APK
        run: flutter build apk --release
        env:
          BLACKPEARL_REQUIRE_SIGNING: '1'
      - name: Verify the signature
        env:
          # SHA-256 of the release signing certificate (public; from keytool -list -v on the release keystore).
          EXPECTED_CERT_SHA256: f236976f66fa697854f3f08271b5fd63ab0383af6958e087daf11e9b0514ba4b
        run: |
          set -euo pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # apksigner's own exit code fails the step when the signature doesn't verify.
          # Depending on its version and the schemes used, apksigner prints "Signer #1 certificate ..." or "V2 Signer: certificate ...".
          certs=$("$apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk)
          printf '%s\n' "$certs" | grep -v -i password
          signers=$(printf '%s\n' "$certs" | sed -n -E 's/^(Signer #[0-9]+|V[0-9.]+ Signer:) certificate SHA-256 digest: *//p' | tr -d ' :' | tr 'A-F' 'a-f' | sort -u)
          if [ "$signers" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::The APK is signed with ${signers:-no certificate}, not the release certificate $EXPECTED_CERT_SHA256"
            exit 1
          fi
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="BlackPearl-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk"
          else
            gh release create "$GITHUB_REF_NAME" "$apk" --title "BlackPearl Mobile ${GITHUB_REF_NAME#v}" --generate-notes
          fi
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
